# Default target is RDS from .env. For an offline database:
#   docker compose --profile local-db up -d db

services:
  db:
    image: postgres:18-alpine
    # profiles: ["local-db"]
    container_name: dnd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PG18+ layout: mount /var/lib/postgresql, not .../data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-dnd}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build: .
    container_name: dnd-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      # lets the container reach an SSM tunnel running on the host
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE:-require}
      PGCONNECT_TIMEOUT: ${PGCONNECT_TIMEOUT:-}
      PGPOOL_TIMEOUT: ${PGPOOL_TIMEOUT:-}
      JWT_SECRET: ${JWT_SECRET:-}

volumes:
  pgdata:
